<aside class="post-author-card" aria-labelledby="post-author-name">
  <p class="post-author-label">About the author</p>
  <img class="post-author-avatar" src="{{ '/assets/img/me-zeus.jpeg' | relative_url }}" alt="{{ site.author | escape }}" width="72" height="72" loading="lazy">
  <h2 class="post-author-name" id="post-author-name">{{ site.author | escape }}</h2>
  <p class="post-author-bio">Software engineer and diver. From Colombia, based in Barcelona. I share experiments and projects in systems, performance engineering, and AI.</p>
  <div class="post-author-links">
    <a href="https://github.com/{{ site.github_username | escape }}" rel="me">GitHub</a>
    <a href="{{ '/contact/' | relative_url }}">Get in touch</a>
  </div>
</aside>
